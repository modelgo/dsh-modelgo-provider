# Bundle layer installed by `dsh plugin add`.
#
# Adds the ModelGo provider route:
#
#   modelgo   https://api.modelgo.ai   key reference MODELGO_API_KEY
#
# Paste the key in Settings → Models or on the plugin's page, or keep it in the
# launching environment under its reference; this file never carries a key value.
# A profile's own cordis.patch.yml can override this row by id.
- insert:
    - id: modelgo
      name: '@model-go/dsh-modelgo-provider'
