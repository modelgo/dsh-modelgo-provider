name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.19', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test
      - run: npm pack --dry-run

  # The plugin on the real engine: packed tarball, isolated DSH_HOME, mock gateway.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dsh: ['0.2.1-rc.2', '0.2.2-rc.1', '0.2.2-rc.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # `dsh plugin add` drives pnpm, which the runner image does not ship.
      - run: npm install --global pnpm @deepseek-ai/dsh@${{ matrix.dsh }}
      - run: npm run smoke:e2e
